name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - ".release-assets/**"
      - ".github/workflows/publish-release.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            gh release upload v1.1.0 \
              ".release-assets/DeepSeek-Web-1.1.0-macOS26-arm64.dmg" \
              ".release-assets/DeepSeek-Web-1.1.0-macOS26-arm64.sha256" \
              --clobber
          else
            gh release create v1.1.0 \
              ".release-assets/DeepSeek-Web-1.1.0-macOS26-arm64.dmg" \
              ".release-assets/DeepSeek-Web-1.1.0-macOS26-arm64.sha256" \
              --title "DeepSeek Web 1.1.0" \
              --notes-file ".github/release-notes/v1.1.0.md" \
              --target main
          fi
